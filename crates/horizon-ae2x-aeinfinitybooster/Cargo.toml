[package]
name = "horizon-ae2x-aeinfinitybooster"
version = "0.1.0"
edition.workspace = true
license = "LGPL-3.0-or-later"
rust-version.workspace = true
description = "AEInfinityBooster 2.1.0 on the AE2 port, above horizon-client (ae2/addons/aeinfinitybooster, docs/ae2-crates.md)"

[dependencies]
# AE2's extension point and the definitions registry; no default features, as horizon-ae2.
horizon-client = { path = "../horizon-client", default-features = false, features = ["ae2-lab"] }
horizon-ae2 = { path = "../horizon-ae2" }
# `aeinfinitybooster-common.toml`.
toml = "1.1"
log = "0.4"

[lints]
workspace = true
