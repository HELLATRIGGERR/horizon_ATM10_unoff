[package]
name = "horizon-ae2x-appmek"
version = "0.1.0"
edition.workspace = true
license = "LGPL-3.0-or-later"
rust-version.workspace = true
description = "Applied Mekanistics 1.6.3 on the AE2 port, above horizon-client (ae2/addons/appmek, docs/appmek.md)"

[dependencies]
# AE2's extension point, the definitions registry and the key types; no default features, as horizon-ae2.
horizon-client = { path = "../horizon-client", default-features = false, features = ["ae2-lab"] }
horizon-ae2 = { path = "../horizon-ae2" }
horizon-world = { path = "../horizon-world" }
ae2-cell-core = { path = "../ae2-cell-core" }
serde_json = "1.0.151"

[lints]
workspace = true
