[package]
name = "horizon-ae2x-kits"
version = "0.1.0"
edition.workspace = true
license = "LGPL-3.0-or-later"
rust-version.workspace = true
description = "The upgrade kits of ExtendedAE and Advanced AE on the AE2 port, above horizon-client (docs/ae2-crates.md)"

[dependencies]
# AE2's extension point and the kit rows; no default features, as horizon-ae2.
horizon-client = { path = "../horizon-client", default-features = false, features = ["ae2-lab"] }
horizon-ae2 = { path = "../horizon-ae2" }
# Block states and part records.
horizon-world = { path = "../horizon-world" }

[lints]
workspace = true
