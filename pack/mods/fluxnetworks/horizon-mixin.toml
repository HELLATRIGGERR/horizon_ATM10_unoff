# Flux Networks as a native mod of this fork (horizon-mixins bundle).
# Flux Networks' code is MIT, Copyright (c) 2017-2021 SonarSonic, BloCamLimb;
# the rules are ported from its source in the crate `fluxnetworks-core`. See
# README.md for the notice and what isn't covered by it (the GUI's art).
#
# It hooks Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the fork's
# Forge Energy and block entity drop hooks). `flux_world` also reads the game's open levels directly,
# to reach a device in any of them. It pins no revision. Its blocks, models and recipes are a content mod
# built locally from the player's jar by `pack/scripts/fluxnetworks.ts content`,
# loaded with `--dev-mod`.
[mod]
id = "fluxnetworks"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "flux-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "flux_world"
source = "runtime/flux_world.rs"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "level-tick-pre"
hook = "level_tick_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/level_tick_pre.rs"
bindings = [
  { name = "level", ty = "mod_api::LevelRef", value = "level" },
]

[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "mod_api::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<horizon_core::nbt::Compound>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-types"
hook = "block_entity_types"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<(String, Vec<String>)>", value = "&mut *types" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "fe-storage"
hook = "fe_storage"
hook_version = 1
kind = "HEAD"
helper = "hooks/fe_storage.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mod_api::ModBlockEntity", value = "entity" },
  { name = "info", ty = "&mut Option<mod_api::NativeFeInfo>", value = "&mut *info" },
]

[[injection]]
id = "fe-receive"
hook = "fe_receive"
hook_version = 1
kind = "MODIFY_ARG"
selector = "self.fire_fe_receive"
require = 1
ordinal = 0
argument = 0
helper = "hooks/fe_receive.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::FeReceiveCall<'_>", value = "$value" },
]

[[injection]]
id = "placed-by"
hook = "on_block_placed_by"
hook_version = 1
kind = "HEAD"
helper = "hooks/on_block_placed_by.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&super::fire::OnBlockPlacedByCall<'_>", value = "&call" },
]

[[injection]]
id = "block-entity-drop"
hook = "block_entity_drop"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_drop.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mod_api::ModBlockEntity", value = "entity" },
  { name = "components", ty = "&mut horizon_core::nbt::Compound", value = "&mut *components" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "hooks/right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "click", ty = "&mod_api::BlockClick<'_>", value = "click" },
  { name = "result", ty = "&mut mod_api::InteractionResult", value = "&mut *cancellation_result" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "menu-clicked"
hook = "menu_clicked"
hook_version = 1
kind = "HEAD"
helper = "hooks/menu_clicked.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slot", ty = "i32", value = "slot" },
  { name = "mode", ty = "i32", value = "mode" },
]

[[injection]]
id = "menu-closed"
hook = "menu_closed"
hook_version = 1
kind = "HEAD"
helper = "hooks/menu_closed.rs"
bindings = [
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 2
kind = "HEAD"
helper = "hooks/register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<mod_api::Command>", value = "&mut *commands" },
]

[[injection]]
id = "run-mod-command"
hook = "run_mod_command"
hook_version = 1
kind = "HEAD"
helper = "hooks/run_mod_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "source", ty = "&mod_api::CommandSource", value = "source" },
  { name = "command", ty = "&mod_api::CommandInvocation", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
