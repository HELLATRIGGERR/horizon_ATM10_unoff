# Flux Networks as a native mod of this fork (horizon-mixins bundle).
# Flux Networks' code is MIT, Copyright (c) 2017-2021 SonarSonic, BloCamLimb;
# the rules are ported from its source in the crate `fluxnetworks-core`. See
# README.md for the notice and what isn't covered by it (the GUI's art).
#
# It hooks Horizon's named hook points and needs hooks API 155 (Forge Energy,
# API 154; block entity drop, API 155). `flux_world` also reads the game's open levels directly,
# to reach a device in any of them. It pins no revision. Its blocks, models and recipes are a content mod
# built locally from the player's jar by `pack/scripts/fluxnetworks.ts content`,
# loaded with `--dev-mod`.
[mod]
id = "fluxnetworks"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "flux-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "flux_world"
source = "runtime/flux_world.rs"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "level-tick-pre"
hook = "level_tick_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/level_tick_pre.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "fe-storage"
hook = "fe_storage"
hook_version = 1
kind = "HEAD"
helper = "hooks/fe_storage.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "info", ty = "&mut Option<crate::game::native_hooks::NativeFeInfo>", value = "&mut *info" },
]

[[injection]]
id = "fe-receive"
hook = "fe_receive"
hook_version = 1
kind = "HEAD"
helper = "hooks/fe_receive.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "max", ty = "i64", value = "max" },
  { name = "simulate", ty = "bool", value = "simulate" },
  { name = "accepted", ty = "&mut Option<i64>", value = "&mut *accepted" },
]

[[injection]]
id = "place-block"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "hooks/place_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "block-entity-drop"
hook = "block_entity_drop"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_drop.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "components", ty = "&mut horizon_world::nbt::Compound", value = "&mut *components" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "hooks/right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "menu-clicked"
hook = "menu_clicked"
hook_version = 1
kind = "HEAD"
helper = "hooks/menu_clicked.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slot", ty = "i32", value = "slot" },
  { name = "mode", ty = "i32", value = "mode" },
]

[[injection]]
id = "menu-closed"
hook = "menu_closed"
hook_version = 1
kind = "HEAD"
helper = "hooks/menu_closed.rs"
bindings = [
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "hooks/register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "hooks/perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
