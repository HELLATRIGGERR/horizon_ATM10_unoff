# FTB Quests as a native mod of this fork (horizon-mixins bundle), slice 1: the quest book read from the
# instance's config/ftbquests/quests, the book screen, item and checkmark tasks with the team's progress saved as
# FTB Quests saves it, and item rewards. See docs/ftb-quests.md.
# FTB Quests 2101.1.37 is All Rights Reserved (FTB): its behaviour is reimplemented in the crate `ftbquests-core`
# and the runtime modules; no file of it is copied. See README.md.
#
# It needs the `ftbteams` bundle (its runtime module `crate::game::ftbteams_world`, in horizon-client with it).
# It hooks Horizon's named hook points only (tools/fork/native-hooks.json: upstream's declared hooks plus the
# fork's compat hooks); it pins no revision.
[mod]
id = "ftbquests"
version = "0.1.0"
priority = 80

[[crate]]
id = "core"
path = "ftbquests-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "ftbquests_world"
source = "runtime/ftbquests_world.rs"

[[module]]
id = "book"
file = "crates/horizon-client/src/game.rs"
name = "ftbquests_book"
source = "runtime/ftbquests_book.rs"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "world-saved"
hook = "world_saved"
hook_version = 1
kind = "HEAD"
helper = "hooks/world_saved.rs"
bindings = []

[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "mod_api::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "logged-in"
hook = "player_logged_in"
hook_version = 1
kind = "HEAD"
helper = "hooks/player_logged_in.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 2
kind = "HEAD"
helper = "hooks/register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<mod_api::Command>", value = "&mut *commands" },
]

[[injection]]
id = "run-mod-command"
hook = "run_mod_command"
hook_version = 1
kind = "HEAD"
helper = "hooks/run_mod_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "source", ty = "&mod_api::CommandSource", value = "source" },
  { name = "command", ty = "&mod_api::CommandInvocation", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 2
kind = "HEAD"
helper = "hooks/use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&mod_api::__private::UseItemCall<'_>", value = "&call" },
]

[[injection]]
id = "use-item-answer"
hook = "use_item"
hook_version = 2
kind = "MODIFY_ARG"
selector = "self.fire_use_item"
require = 1
ordinal = 0
argument = 0
helper = "hooks/use_item_answer.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::UseItemCall<'_>", value = "$value" },
]

[[injection]]
id = "net-from-client"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "hooks/net_from_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "net-from-server"
hook = "net_from_server"
hook_version = 1
kind = "HEAD"
helper = "hooks/net_from_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "key"
hook = "input_key"
hook_version = 2
kind = "HEAD"
helper = "hooks/input_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "action", ty = "mod_api::KeyAction", value = "action" },
]

[[injection]]
id = "frame"
hook = "render_frame_pre"
hook_version = 2
kind = "HEAD"
helper = "hooks/render_frame_pre.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "screen-render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_render_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
  { name = "screen", ty = "&mod_api::ScreenView<'_>", value = "screen" },
]

[[injection]]
id = "screen-pressed"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_mouse_button_pressed_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&mod_api::ScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-dragged"
hook = "screen_mouse_dragged_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_mouse_dragged_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&mod_api::ScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-scrolled"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_mouse_scrolled_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&mod_api::ScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "client-commands"
hook = "register_client_commands"
hook_version = 1
kind = "HEAD"
helper = "hooks/register_client_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<mod_api::Command>", value = "&mut *commands" },
]

[[injection]]
id = "client-command"
hook = "command"
hook_version = 2
kind = "HEAD"
helper = "hooks/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
