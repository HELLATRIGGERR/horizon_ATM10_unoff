# Hostile Neural Networks' Simulation Chamber and Loot Fabricator as a native mod of this fork (horizon-mixins bundle).
# Hostile Neural Networks is MIT; see this folder's README.md and LICENSE-hostilenetworks. The code here is translated
# to Rust from its source at 6.5.1 (the version All the Mods 10 ships).
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the fork's
# hooks such as fe_receive): it pins no revision. Its blocks, items, models, tiers and data models are the carry of
# the player's own jar (horizon-port-pack carry, with ATM10's KubeJS data models laid over it), loaded with `--dev-mod`;
# the machines read the tiers and the data models through `native_data_files` (API 423). The item components
# (`hostilenetworks:data_model`, `:data`, `:iterations`) are registered through `native_component_types` (API 65).
[mod]
id = "hostilenetworks"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "hostilenetworks-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "hostilenetworks_world"
source = "runtime/hostilenetworks_world.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "hostilenetworks_ui"
source = "runtime/hostilenetworks_ui.rs"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = []

[[injection]]
id = "component-types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "hooks/component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "&mut *types" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<horizon_core::nbt::Compound>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-types"
hook = "block_entity_types"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<(String, Vec<String>)>", value = "&mut *types" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-slot-accepts"
hook = "block_entity_slot_accepts"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_slot_accepts.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "accepts", ty = "&mut bool", value = "&mut *accepts" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "menu-button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "hooks/menu_button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&mod_api::item::menu::MenuButtonContext", value = "context" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "fe-storage"
hook = "fe_storage"
hook_version = 1
kind = "HEAD"
helper = "hooks/fe_storage.rs"
bindings = [
  { name = "entity", ty = "&mod_api::ModBlockEntity", value = "entity" },
  { name = "info", ty = "&mut Option<mod_api::NativeFeInfo>", value = "&mut *info" },
]

[[injection]]
id = "fe-receive"
hook = "fe_receive"
hook_version = 1
kind = "MODIFY_ARG"
selector = "self.fire_fe_receive"
require = 1
ordinal = 0
argument = 0
helper = "hooks/fe_receive.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::FeReceiveCall<'_>", value = "$value" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<mod_api::Screen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "screen-click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "screen-tooltip"
hook = "screen_tooltip"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_tooltip.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "lines", ty = "&mut Vec<String>", value = "&mut *lines" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 2
kind = "HEAD"
helper = "hooks/register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<mod_api::Command>", value = "&mut *commands" },
]

[[injection]]
id = "run-mod-command"
hook = "run_mod_command"
hook_version = 1
kind = "HEAD"
helper = "hooks/run_mod_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "source", ty = "&mod_api::CommandSource", value = "source" },
  { name = "command", ty = "&mod_api::CommandInvocation", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
