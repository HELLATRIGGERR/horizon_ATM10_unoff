# Iron Furnaces' furnaces as a native mod of this fork (horizon-mixins bundle).
# Iron Furnaces is Apache-2.0; see this folder's README.md, LICENSE-ironfurnaces and NOTICE-ironfurnaces. The code
# here is translated to Rust from its source at 4.3.2 (the version All the Mods 10 ships).
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the fork's
# compat hooks such as block_entity_container): it pins no revision. Its blocks, items, models and recipes are the carry of
# the player's own jar (horizon-port-pack carry), loaded with `--dev-mod`; the world's smelting, blasting and
# smoking recipes come through `native_cooking_recipes` (API 421), as Mekanism's smelter reads them.
[mod]
id = "ironfurnaces"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "ironfurnaces-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "ironfurnaces_world"
source = "runtime/ironfurnaces_world.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "ironfurnaces_ui"
source = "runtime/ironfurnaces_ui.rs"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = []

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<horizon_core::nbt::Compound>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-slot-accepts"
hook = "block_entity_slot_accepts"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_slot_accepts.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "fuel", ty = "bool", value = "fuel" },
  { name = "accepts", ty = "&mut bool", value = "&mut *accepts" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

# The fork's use_item_on (where `ItemStack.useOn` starts) is upstream's use_on v2: one call, read at the head with the
# game, answered by a MODIFY_ARG helper on the call into fire_use_on.
[[injection]]
id = "use-on"
hook = "use_on"
hook_version = 2
kind = "HEAD"
helper = "hooks/use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&mod_api::__private::UseOnCall<'_>", value = "&call" },
]

[[injection]]
id = "use-on-answer"
hook = "use_on"
hook_version = 2
kind = "MODIFY_ARG"
selector = "self.fire_use_on"
require = 1
ordinal = 0
argument = 0
helper = "hooks/use_on_answer.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::UseOnCall<'_>", value = "$value" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<mod_api::Screen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]
