# JEI (Just Enough Items) 19.70.0.464 as a native mod of this fork (horizon-mixins bundle), slice 1: the
# ingredient list beside container screens and its search. JEI is MIT (mezz); its behaviour is reimplemented
# in the crate `jei-core` from what the mod does; no file of it is copied. JEI's artwork for the panel is the
# engine's (`NativePanelStyle::Viewer`); the rest comes from the player's jar at run time. See README.md.
# It hooks Horizon's named hook points only; it pins no revision.
[mod]
id = "jei"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "jei-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "jei_world"
source = "runtime/jei_world.rs"

[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "hooks/mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "hooks/settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "hooks/settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "hooks/frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "panel-event"
hook = "panel_event"
hook_version = 1
kind = "HEAD"
helper = "hooks/panel_event.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "event", ty = "&crate::game::native_hooks::NativePanelEvent", value = "event" },
]

[[injection]]
id = "screen-key"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_key_pressed_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "repeat", ty = "bool", value = "repeat" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "client-commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "hooks/commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "client-command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "hooks/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]
