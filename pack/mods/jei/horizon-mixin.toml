# JEI (Just Enough Items) 19.70.0.464 as a native mod of this fork (horizon-mixins bundle): the ingredient list
# beside container screens and its search (slice 1), the recipe screen with R, U and Backspace (slice 2), drawn as
# JEI's own centred window over the screen (slice 2b), the bookmarks (slice 3: A, the list left of the screen, the
# per-world bookmarks.json). JEI is
# MIT (mezz); its behaviour is reimplemented in the crate `jei-core` from what the mod does; no file of it is
# copied. JEI's artwork for the panel is the engine's (`NativePanelStyle::Viewer`); the recipe window's sprites come
# from the player's jar at run time through the carry (`jei:gui/sprites/...`). See README.md.
# It hooks Horizon's named hook points only; it pins no revision.
[mod]
id = "jei"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "jei-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "jei_world"
source = "runtime/jei_world.rs"

[[module]]
id = "recipes"
file = "crates/horizon-client/src/game.rs"
name = "jei_recipes"
source = "runtime/jei_recipes.rs"

[[module]]
id = "window"
file = "crates/horizon-client/src/game.rs"
name = "jei_window"
source = "runtime/jei_window.rs"

[[module]]
id = "config"
file = "crates/horizon-client/src/game.rs"
name = "jei_config"
source = "runtime/jei_config.rs"

[[module]]
id = "bookmarks"
file = "crates/horizon-client/src/game.rs"
name = "jei_bookmarks"
source = "runtime/jei_bookmarks.rs"

[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "hooks/mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "hooks/settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "hooks/settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "hooks/frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "panel-event"
hook = "panel_event"
hook_version = 1
kind = "HEAD"
helper = "hooks/panel_event.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "event", ty = "&crate::game::native_hooks::NativePanelEvent", value = "event" },
]

[[injection]]
id = "screen-key"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_key_pressed_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "repeat", ty = "bool", value = "repeat" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "client-commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "hooks/commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "client-command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "hooks/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "recipe-lookup"
hook = "recipe_lookup"
hook_version = 1
kind = "HEAD"
helper = "hooks/recipe_lookup.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::game::native_hooks::NativeStack", value = "stack" },
  { name = "lookup", ty = "&crate::game::native_hooks::NativeRecipeLookup", value = "lookup" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "screen-render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_render_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "mouse-pressed"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_mouse_button_pressed_pre.rs"
bindings = [
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "mouse-released"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_mouse_button_released_pre.rs"
bindings = [
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "mouse-scrolled"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_mouse_scrolled_pre.rs"
bindings = [
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "hooks/tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]
