# The goo's revival is `GooBlock_Base.useItemOn`; the goo's template has no use of its own, so the click reaches the
# item's `useOn`, upstream's use_on v2: one call, read at the head with the game, answered by a MODIFY_ARG helper on
# the call into fire_use_on (as Iron Furnaces' upgrades).
[[injection]]
id = "use-on"
hook = "use_on"
hook_version = 2
kind = "HEAD"
helper = "hooks/use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&mod_api::__private::UseOnCall<'_>", value = "&call" },
]

[[injection]]
id = "use-on-answer"
hook = "use_on"
hook_version = 2
kind = "MODIFY_ARG"
selector = "self.fire_use_on"
require = 1
ordinal = 0
argument = 0
helper = "hooks/use_on_answer.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::UseOnCall<'_>", value = "$value" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<mod_api::Screen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_draw.rs"
bindings = [
