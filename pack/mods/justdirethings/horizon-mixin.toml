# Just Dire Things' goo blocks, machines, fluid drop, time crystals and Paradox Machine as a native mod of this fork
# (horizon-mixins bundle).
# Just Dire Things is MIT; see this folder's README.md and LICENSE-justdirethings. The code here is translated to Rust
# from its source at 1.5.7 (the version All the Mods 10 ships).
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the fork's
# hooks such as fe_extract): it pins no revision. Its blocks, items, models, recipes and tags are the carry of the
# player's own jar (horizon-port-pack carry), loaded with `--dev-mod`; the goo reads its spreading recipes from the
# world's tables (`native_recipes_of_type`, the carried types `justdirethings:goospread` and `goospread_tag`).
[mod]
id = "justdirethings"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "justdirethings-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_world"
source = "runtime/justdirethings_world.rs"

[[module]]
id = "time"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_time"
source = "runtime/justdirethings_time.rs"

[[module]]
id = "machines"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_machines"
source = "runtime/justdirethings_machines.rs"

[[module]]
id = "paradox-ui"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_paradox_ui"
source = "runtime/justdirethings_paradox_ui.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_ui"
source = "runtime/justdirethings_ui.rs"

