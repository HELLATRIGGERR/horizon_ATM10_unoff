# The fluid drop (`EntityEvents.entityTick` on `EntityTickEvent.Post`): the game tells entity ticks only while a mod
# listens, so the bundle listens and acts on the item entities.
[[injection]]
id = "entity-tick-listened"
hook = "entity_tick_listened"
hook_version = 1
kind = "HEAD"
helper = "hooks/entity_tick_listened.rs"
bindings = [
  { name = "listened", ty = "&mut bool", value = "&mut *listened" },
]

[[injection]]
id = "entity-tick-post"
hook = "entity_tick_post"
hook_version = 1
kind = "HEAD"
helper = "hooks/entity_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

# The time crystal's budding block grows its own way (`TimeCrystalBuddingBlock.randomTick`), not as its template.
[[injection]]
id = "random-tick"
hook = "random_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/random_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "ticks", ty = "&mut horizon_world::level::Ticks", value = "&mut *ticks" },
  { name = "dimension", ty = "horizon_core::dimension::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

