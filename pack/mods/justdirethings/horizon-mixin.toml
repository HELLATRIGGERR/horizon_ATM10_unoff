# Just Dire Things' goo blocks and Generator T1 as a native mod of this fork (horizon-mixins bundle).
# Just Dire Things is MIT; see this folder's README.md and LICENSE-justdirethings. The code here is translated to Rust
# from its source at 1.5.7 (the version All the Mods 10 ships).
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the fork's
# hooks such as fe_extract): it pins no revision. Its blocks, items, models, recipes and tags are the carry of the
# player's own jar (horizon-port-pack carry), loaded with `--dev-mod`; the goo reads its spreading recipes from the
# world's tables (`native_recipes_of_type`, the carried types `justdirethings:goospread` and `goospread_tag`).
[mod]
id = "justdirethings"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "justdirethings-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_world"
source = "runtime/justdirethings_world.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "justdirethings_ui"
source = "runtime/justdirethings_ui.rs"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = [

]

[[injection]]
id = "block-entity-types"
hook = "block_entity_types"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<(String, Vec<String>)>", value = "&mut *types" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<horizon_core::nbt::Compound>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-slot-accepts"
hook = "block_entity_slot_accepts"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_slot_accepts.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "fuel", ty = "bool", value = "fuel" },
  { name = "accepts", ty = "&mut bool", value = "&mut *accepts" },
]

[[injection]]
id = "fe-storage"
hook = "fe_storage"
hook_version = 1
kind = "HEAD"
helper = "hooks/fe_storage.rs"
bindings = [
  { name = "entity", ty = "&mod_api::ModBlockEntity", value = "entity" },
  { name = "info", ty = "&mut Option<mod_api::NativeFeInfo>", value = "&mut *info" },
]

[[injection]]
id = "fe-extract"
hook = "fe_extract"
hook_version = 1
kind = "MODIFY_ARG"
selector = "self.fire_fe_extract"
require = 1
ordinal = 0
argument = 0
helper = "hooks/fe_extract.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::FeExtractCall<'_>", value = "$value" },
]

[[injection]]
id = "menu-button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "hooks/menu_button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&mod_api::item::menu::MenuButtonContext", value = "context" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

# The goo's revival is `GooBlock_Base.useItemOn`; the goo's template has no use of its own, so the click reaches the
# item's `useOn`, upstream's use_on v2: one call, read at the head with the game, answered by a MODIFY_ARG helper on
# the call into fire_use_on (as Iron Furnaces' upgrades).
[[injection]]
id = "use-on"
hook = "use_on"
hook_version = 2
kind = "HEAD"
helper = "hooks/use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&mod_api::__private::UseOnCall<'_>", value = "&call" },
]

[[injection]]
id = "use-on-answer"
hook = "use_on"
hook_version = 2
kind = "MODIFY_ARG"
selector = "self.fire_use_on"
require = 1
ordinal = 0
argument = 0
helper = "hooks/use_on_answer.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::UseOnCall<'_>", value = "$value" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<mod_api::Screen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "screen-click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "screen-tooltip"
hook = "screen_tooltip"
hook_version = 1
kind = "HEAD"
helper = "hooks/screen_tooltip.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "lines", ty = "&mut Vec<String>", value = "&mut *lines" },
]
