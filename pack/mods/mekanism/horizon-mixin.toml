# Mekanism's energy, its processing machines and factories, its chemicals (the
# registry, tanks, the chemical handler, the Electrolytic Separator, the
# Chemical Tanks and their items, the Pressurized Tubes, the Chemical Oxidizer
# and Chemical Infuser, the ore chain's Chemical Dissolution Chamber, Chemical
# Washer and Chemical Crystallizer, the Rotary Condensentrator), its Mechanical
# Pipes, Fluid Tanks, Logistical Transporters and Configurator, its multiblocks
# (the Dynamic Tank and the Induction Matrix), Mekanism Generators' Solar, Heat,
# Gas-Burning, Bio, Wind and Advanced Solar Generators, and its Electric Pump and
# Fluidic Plenisher, as a native mod of this fork
# (horizon-mixins bundle). Mekanism is MIT, Copyright (c) 2017-2025 Aidan C. Brady; the rules
# are ported from its source in the crate `mekanism-energy`.
#
# It hooks only Horizon's named hook points (API 3, 7, 8, 12-21, 23, 26,
# 42, 45, 47, 60, 71, 416-418, 420 and 422) and calls the helpers of API 419 (`native_biome_climate`,
# `native_dimension_type`), 421 (`native_cooking_recipes`), 422 (`FluidStack`, the fluid handler helpers), 423
# (`native_data_files`, the content's chemical declarations), 424 (`native_used_stack`,
# `native_instabuild`: the tier installers), 425 (`native_insert_slots`, `native_pop_resource`: the
# transporters) and 426 (`native_level_particles`: a multiblock's sparkles), the attachments
# helper (`native_attachments`: the multiblocks' caches in the level's saved data), and upstream's pending
# `native_default_state` and `native_sneaking` (fragments default_state and host_bridge: the tier installers and
# the Configurator), so it builds on any Horizon with hooks API 426 or later: it pins no
# revision (horizon-mixins
# refuses any other commit than a pinned one). Its blocks, models and recipes are two content mods,
# `mekanism` and `mekanismgenerators`, built from the ATM10 carries by
# `mekanism-content` (see pack/scripts/mekanism.ts), loaded with `--dev-mod`.
[mod]
id = "mekanism"
version = "0.9.0"
priority = 100

