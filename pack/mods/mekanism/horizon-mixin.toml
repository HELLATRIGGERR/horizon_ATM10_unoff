# Mekanism's energy, its processing machines and factories, its chemicals (the
# registry, tanks, the chemical handler, the Electrolytic Separator, the
# Chemical Tanks and their items, the Pressurized Tubes, the Chemical Oxidizer
# and Chemical Infuser, the ore chain's Chemical Dissolution Chamber, Chemical
# Washer and Chemical Crystallizer, the Rotary Condensentrator, the Pressurized
# Reaction Chamber, the Isotopic Centrifuge and the Solar Neutron Activator, the Pigment Extractor,
# the Pigment Mixer and the Painting Machine), its Nutritional Liquifier, its QIO Drive Array and Dashboard (drives, a
# frequency, the item viewer), its Antiprotonic
# Nucleosynthesizer, its Laser, Laser Amplifier and Laser Tractor Beam, its Mechanical Pipes, Fluid Tanks, Logistical Transporters and Configurator, its multiblocks
# (the Dynamic Tank, the Induction Matrix, the Thermal Evaporation Plant, the Thermoelectric Boiler and the SPS) and
# its Resistive Heater, Mekanism Generators' Solar, Heat,
# Gas-Burning, Bio, Wind and Advanced Solar Generators, Industrial Turbine and Fission Reactor, its Electric Pump and
# Fluidic Plenisher, its Digital Miner, and its radiation (sources, players' doses, the Geiger Counter and Dosimeter), as a native mod of
# this fork
# (horizon-mixins bundle). Mekanism is MIT, Copyright (c) 2017-2025 Aidan C. Brady; the rules
# are ported from its source in the crate `mekanism-energy`.
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the
# fork's hooks such as fe_receive and the chemical handler, and the compat hooks net_from_client/net_from_server for
# the QIO screens' mod messages) and calls the fork's helper surface (game/modding/fork_compat: native_chemical_*,
# native_biome_climate, native_cooking_recipes, native_food_table, native_data_files, native_used_stack,
# native_instabuild, native_insert_slots, native_pop_resource, native_level_particles, the player helpers,
# native_explode, native_neighbor_signal, native_force_chunk, native_attachments, native_machine_destroy_block, ...):
# it pins no revision (horizon-mixins
# refuses any other commit than a pinned one). Its blocks, models and recipes are two content mods,
# `mekanism` and `mekanismgenerators`, built from the ATM10 carries by
# `mekanism-content` (see pack/scripts/mekanism.ts), loaded with `--dev-mod`.
[mod]
id = "mekanism"
version = "0.9.0"
priority = 100

