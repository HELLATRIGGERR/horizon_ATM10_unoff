# Mekanism's energy, its first processing machines and Mekanism Generators'
# Solar and Heat Generators as a native mod of this fork (horizon-mixins
# bundle). Mekanism is MIT, Copyright (c) 2017-2025 Aidan C. Brady; the rules
# are ported from its source in the crate `mekanism-energy`.
#
# It hooks only Horizon's named hook points (API 3, 7, 8, 12, 14-20, 23, 26,
# 42, 47, 60, 154-156 and 158) and calls the helpers of API 157 (`native_biome`,
# `native_dimension_type`) and 159 (`native_cooking_recipes`), so it builds on
# any Horizon with hooks API 159 or later: it pins no revision (horizon-mixins
# refuses any other commit than a pinned one). Its blocks, models and recipes are two content mods,
# `mekanism` and `mekanismgenerators`, built from the ATM10 carries by
# `mekanism-content` (see pack/scripts/mekanism.ts), loaded with `--dev-mod`.
[mod]
id = "mekanism"
version = "0.8.0"
priority = 100

[[crate]]
id = "energy"
path = "mekanism-energy"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "mek_world"
source = "runtime/mek_world.rs"

[[module]]
id = "machines"
file = "crates/horizon-client/src/game.rs"
name = "mek_machines"
source = "runtime/mek_machines.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "mek_ui"
source = "runtime/mek_ui.rs"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

