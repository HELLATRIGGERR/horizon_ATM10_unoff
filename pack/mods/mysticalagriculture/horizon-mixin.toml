# Mystical Agriculture's crops and infusion altar as a native mod of this fork (horizon-mixins bundle).
# Mystical Agriculture and Cucumber are MIT (BlakeBr0): see LICENSE-mysticalagriculture, LICENSE-cucumber and
# README.md. The rules are translated from their source into `ma-core`.
#
# It hooks only Horizon's named hook points that main has (API 13-21, 33, 72, 75, 417), so it builds on any
# Horizon with hooks API 441 or later: it pins no revision. Its blocks, items, recipes and assets are the carry
# of the player's own jar (horizon-port-pack), loaded with `--dev-mod` (see pack/scripts/mysticalagriculture.ts).
[mod]
id = "mysticalagriculture"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "ma-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "ma_world"
source = "runtime/ma_world.rs"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "random-tick"
hook = "random_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/random_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "bonemeal-target"
hook = "is_valid_bonemeal_target"
hook_version = 1
kind = "HEAD"
helper = "hooks/is_valid_bonemeal_target.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "valid", ty = "&mut Option<bool>", value = "&mut *valid" },
]

[[injection]]
id = "bonemeal-success"
hook = "is_bonemeal_success"
hook_version = 1
kind = "HEAD"
helper = "hooks/is_bonemeal_success.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "success", ty = "&mut bool", value = "&mut *success" },
]

[[injection]]
id = "loot-drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "hooks/loot_drops.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "&mut *drops" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-slot-accepts"
hook = "block_entity_slot_accepts"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_slot_accepts.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "accepts", ty = "&mut bool", value = "&mut *accepts" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "hooks/right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "may-place-on"
hook = "may_place_on"
hook_version = 1
kind = "HEAD"
helper = "hooks/may_place_on.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "ground", ty = "horizon_world::registry::BlockStateId", value = "ground" },
  { name = "may", ty = "&mut Option<bool>", value = "&mut *may" },
]
