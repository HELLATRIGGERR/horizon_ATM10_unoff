# Occultism's rituals and spirit fire as a native mod of this fork (horizon-mixins bundle). Occultism is MIT
# (Copyright 2020 klikli-dev); this bundle translates its code (see README.md and LICENSE-occultism).
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json: upstream's declared hooks plus the fork's
# compat hooks such as block_entity_container), and pins no revision. Occultism's blocks, items,
# recipes, pentacles and assets come from the carry of the player's own jar (`horizon-port-pack carry`), loaded with
# `--dev-mod`; the bundle adds their behaviour.
[mod]
id = "occultism"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "occultism-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "occultism_world"
source = "runtime/occultism_world.rs"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = []

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<horizon_core::nbt::Compound>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-types"
hook = "block_entity_types"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<(String, Vec<String>)>", value = "&mut *types" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "hooks/right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "click", ty = "&mod_api::BlockClick<'_>", value = "click" },
  { name = "result", ty = "&mut mod_api::InteractionResult", value = "&mut *cancellation_result" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 2
kind = "HEAD"
helper = "hooks/use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&mod_api::__private::UseItemCall<'_>", value = "&call" },
]

# The fork's block_entity_inside is upstream's entity_inside (`Block.entityInside`): one call, read at the head.
[[injection]]
id = "entity-inside"
hook = "entity_inside"
hook_version = 1
kind = "HEAD"
helper = "hooks/entity_inside.rs"
bindings = [
  { name = "call", ty = "&super::fire::EntityInsideCall<'_>", value = "&call" },
]

[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "hooks/level_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "level", ty = "mod_api::LevelRef", value = "level" },
]
