# Theurgy's spagyrics apparatus as a native mod of this fork (horizon-mixins bundle). Theurgy's code is MIT
# (Copyright 2022 klikli-dev); this bundle translates it (see README.md and LICENSE-theurgy).
#
# It hooks only Horizon's named hook points (tools/fork/native-hooks.json) and pins no revision. Theurgy's blocks,
# items, fluids, recipes and assets come from the carry of the player's own jar (`horizon-port-pack carry`), loaded
# with `--dev-mod`; the bundle adds their behaviour.
[mod]
id = "theurgy"
version = "0.1.0"
priority = 100

[[crate]]
id = "core"
path = "theurgy-core"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "theurgy_world"
source = "runtime/theurgy_world.rs"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 2
kind = "HEAD"
helper = "hooks/world_lifecycle.rs"
bindings = [
  { name = "phase", ty = "mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server-started"
hook = "server_started"
hook_version = 1
kind = "HEAD"
helper = "hooks/server_started.rs"
bindings = []

[[injection]]
id = "block-entity-types"
hook = "block_entity_types"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<(String, Vec<String>)>", value = "&mut *types" },
]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<horizon_core::nbt::Compound>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "hooks/block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut mod_api::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "hooks/right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "click", ty = "&mod_api::BlockClick<'_>", value = "click" },
  { name = "result", ty = "&mut mod_api::InteractionResult", value = "&mut *cancellation_result" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "placed-by"
hook = "on_block_placed_by"
hook_version = 1
kind = "HEAD"
helper = "hooks/on_block_placed_by.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "call", ty = "&super::fire::OnBlockPlacedByCall<'_>", value = "&call" },
]

[[injection]]
id = "fluid-handler-tanks"
hook = "fluid_handler_tanks"
hook_version = 1
kind = "HEAD"
helper = "hooks/fluid_handler_tanks.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "Option<horizon_core::geometry::Direction>", value = "face" },
  { name = "entity", ty = "&mod_api::ModBlockEntity", value = "entity" },
  { name = "tanks", ty = "&mut Option<Vec<mod_api::NativeFluidTankInfo>>", value = "&mut *tanks" },
]

[[injection]]
id = "fluid-handler-fill"
hook = "fluid_handler_fill"
hook_version = 1
kind = "MODIFY_ARG"
selector = "self.fire_fluid_handler_fill"
require = 1
ordinal = 0
argument = 0
helper = "hooks/fluid_handler_fill.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::FluidHandlerFillCall<'_>", value = "$value" },
]

[[injection]]
id = "fluid-handler-drain"
hook = "fluid_handler_drain"
hook_version = 1
kind = "MODIFY_ARG"
selector = "self.fire_fluid_handler_drain"
require = 1
ordinal = 0
argument = 0
helper = "hooks/fluid_handler_drain.rs"
bindings = [
  { name = "call", ty = "mod_api::__private::FluidHandlerDrainCall<'_>", value = "$value" },
]
