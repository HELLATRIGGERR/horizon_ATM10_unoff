# This fork as a modpack: which mods the build turns on, and the settings each
# takes from an installed All the Mods 10 (ATM10), as ATM10 ships them.
#
# `feature` is the Cargo feature of horizon-client that builds the mod in;
# `bundle`, the native mod under pack/ (a horizon-mixins bundle) that does.
# `configs` are paths under ATM10's `config/` that `pack/scripts/sync-atm10.ts`
# copies into the game's `config/`. ATM10's files are not stored here: they
# come from the player's own instance (`ATM10_DIR`).

[mods.ae2]
name = "Applied Energistics 2"
enabled = true
feature = "ae2-lab"
configs = ["ae2-common.toml", "ae2-client.toml"]

# Energy first: the Energy Cubes of every tier and the Universal Cables work,
# with Mekanism's screen and side configuration, and Mekanism Generators' Solar
# and Heat Generators (the other machines are planned). ATM10 runs Mekanism
# 10.7.19: energy in Joules, FE * feConversionRate = J (general.toml), tier
# sizes in tiers.toml, generators in generators.toml and generator-storage.toml.
# A native bundle (`bundle`) over two content mods that `mekanism-content`
# builds from the ATM10 carries; `pack/scripts/mekanism.ts` builds and tests them.
[mods.mekanism]
name = "Mekanism"
enabled = true
bundle = "mods/mekanism"
configs = [
  "Mekanism/general.toml", "Mekanism/tiers.toml", "Mekanism/startup.toml",
  "Mekanism/common.toml", "Mekanism/client.toml", "Mekanism/world.toml",
  "Mekanism/machine-storage.toml", "Mekanism/machine-usage.toml",
  "Mekanism/generators.toml", "Mekanism/generator-storage.toml",
]

[mods.powah]
name = "Powah"
enabled = false
configs = ["powah.json5"]

# One network in one dimension: plugs and points, picked from a chest menu in
# place of the mod's GUI (storages, the controller and the rest are planned). A
# native bundle over a content mod built from the player's jar;
# `pack/scripts/fluxnetworks.ts` builds and tests both.
[mods.fluxnetworks]
name = "Flux Networks"
enabled = true
bundle = "mods/fluxnetworks"
configs = ["fluxnetworks-common.toml", "fluxnetworks-server.toml", "fluxnetworks-client.toml"]

# AE2 addons. `content` is the addon's content folder under content/, which
# `ATM10_DIR=... bun run ae2/scripts/prepare-addon.ts <id>` writes from ATM10's
# jar; ae2/scripts/play.ts loads it next to AE2's. See ae2/addons/<id>/.

# MEGA Cells: 1M to 256M storage cells (slice 1; ae2/addons/megacells).
[mods.megacells]
name = "MEGA Cells"
enabled = true
feature = "ae2-megacells"
content = "megacells"
configs = ["megacells-common.toml"]

# ME Requester: keeps items and fluids in stock by requesting crafts
# (ae2/addons/merequester).
[mods.merequester]
name = "ME Requester"
enabled = true
feature = "ae2-merequester"
content = "merequester"
configs = ["merequester-common.toml"]

# ExtendedAE: the bigger Pattern Provider, Interface and Drive (slice 1;
# ae2/addons/extendedae).
[mods.extendedae]
name = "ExtendedAE"
enabled = true
feature = "ae2-extendedae"
content = "extendedae"
configs = ["extendedae-common.toml"]

# AE2WTLib: the wireless terminal registry, the Wireless Universal Terminal
# and the wireless pattern encoding and access terminals (slice 1;
# ae2/addons/ae2wtlib).
[mods.ae2wtlib]
name = "AE2WTLib"
enabled = true
feature = "ae2-ae2wtlib"
content = "ae2wtlib"
configs = ["ae2wtlib.toml"]

# AEInfinityBooster: the Infinity Range Booster and the Dimension Card in the
# Wireless Access Point (slices 1-2; ae2/addons/aeinfinitybooster).
[mods.aeinfinitybooster]
name = "AEInfinityBooster"
enabled = true
feature = "ae2-aeinfinitybooster"
content = "aeinfinitybooster"
configs = ["aeinfinitybooster-common.toml"]

# AE2 Import Export Card: the Import, Export and Block Picker Cards in the
# wireless terminals (slices 1-4; ae2/addons/ae2importexportcard). Its config
# is a server config (`serverconfig/`); All the Mods 10 ships none.
[mods.ae2importexportcard]
name = "AE2 Import Export Card"
enabled = true
feature = "ae2-importexportcard"
content = "ae2importexportcard"
configs = ["ae2importexportcard-server.toml"]

# Applied Flux: FE as an ME key type, the FE storage cells, and FE between the
# grid and FE blocks through storage, import and export buses (slice 1;
# ae2/addons/appflux). Its import strategy follows `misc.enable` of
# appflux-common.toml, which All the Mods 10 ships none of (off).
[mods.appflux]
name = "Applied Flux"
enabled = true
feature = "ae2-appflux"
content = "appflux"
configs = ["appflux-common.toml"]
